name: check

on:
  push:
  pull_request:

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate (marketplace et plugins)
        run: claude plugin validate .
      - name: Test (chaque plugin)
        run: |
          for dir in $(jq -r '.plugins[].source' .claude-plugin/marketplace.json); do
            echo "::group::$dir"
            claude plugin test "$dir"
            echo "::endgroup::"
          done
      - name: Packaging (auto-update, installation dans un HOME isolé)
        run: bash scripts/test-packaging.sh
